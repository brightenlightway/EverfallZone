name: Build EverZones

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build EverZones
        run: gradle build

      - name: Upload EverZones JAR
        uses: actions/upload-artifact@v4
        with:
          name: EverZones
          path: build/libs/*.jar
